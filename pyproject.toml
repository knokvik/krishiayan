[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krishiayan"
version = "0.1.0"
description = "AI soil intelligence brain for the Krishiayan in-situ probe — raw readings to fertilizer what/when."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Niraj Rajendra Naphade" },
  { name = "Yash Rajesh Kalagate" },
]
keywords = ["agritech", "soil", "ml", "fertilizer", "precision-agriculture"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "joblib>=1.4",
  "redis>=5.1",
  "celery>=5.4",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.12",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "matplotlib>=3.9",
  "seaborn>=0.13",
]
viz = [
  "matplotlib>=3.9",
  "seaborn>=0.13",
]

[project.scripts]
krishiayan = "krishiayan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "ml", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
