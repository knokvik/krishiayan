services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: krishiayan
      POSTGRES_PASSWORD: krishiayan
      POSTGRES_DB: krishiayan
    ports:
      - "5433:5432"
    volumes:
      - krishiayan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishiayan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn krishiayan.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://krishiayan:krishiayan@db:5432/krishiayan
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SECRET_KEY: docker-dev-secret-change-me
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  worker:
    build: .
    command: celery -A krishiayan.worker.celery_app worker -l info
    environment:
      DATABASE_URL: postgresql+psycopg://krishiayan:krishiayan@db:5432/krishiayan
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SECRET_KEY: docker-dev-secret-change-me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  krishiayan_pg:
